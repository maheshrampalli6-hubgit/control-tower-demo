<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABC Delivery Control Tower · Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar" aria-label="Main">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">ABC</div>
        <div>
          <div class="brand-name">Control Tower</div>
          <div class="brand-sub">Delivery performance</div>
        </div>
      </div>
      <a href="#/ceo" data-nav="ceo">Overview</a>
      <a href="#/ops" data-nav="ops">Live network</a>
      <a href="#/region/CHI" data-nav="region">Regions</a>
      <a href="#/hub" data-nav="hub">Hubs</a>
      <a href="#/alerts" data-nav="alerts">Alerts <span class="nav-badge" id="nav-alerts"></span></a>
      <a href="#/parcel" data-nav="parcel">Parcel tracker</a>
      <a href="#/product" data-nav="product">Product KPIs</a>
      <div class="sidebar-foot">
        <span class="demo-chip">Demo · simulated data</span>
        <p>ABC Inc. is fictional. Numbers are generated by a simulator and change every few seconds.</p>
      </div>
    </nav>

    <div class="main">
      <header class="topbar">
        <label class="field">
          <span>Viewing as</span>
          <select id="role">
            <option value="ceo">CEO</option>
            <option value="ops">Operations Head</option>
            <option value="region">Regional Manager</option>
            <option value="hub">Hub Manager</option>
          </select>
        </label>
        <label class="field" id="region-field">
          <span>Region</span>
          <select id="region-select"></select>
        </label>
        <label class="field" id="hub-field">
          <span>Hub</span>
          <select id="hub-select"></select>
        </label>
        <form class="search" id="search-form" role="search">
          <label class="sr-only" for="search">Search</label>
          <input id="search" type="search" placeholder="Search parcel ID, vehicle (TRK-012), hub (CHI-H001)…" autocomplete="off">
          <button type="submit">Search</button>
        </form>
        <div class="clock" id="clock" aria-live="polite">
          <span class="live-dot" aria-hidden="true"></span><span id="clock-text">Loading…</span>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/vendor/chart.js/chart.umd.js"></script>
  <script src="/app.js"></script>
</body>
</html>
